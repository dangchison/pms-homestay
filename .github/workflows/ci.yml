# CI (docs/11 §CI): lint → typecheck → test (kèm PG16+Redis7 thật) → build
# + gate "introspection clean" (ADR-0001) + security scan.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test env (khớp test/setup.ts + docker-compose.dev.yml)
  DATABASE_URL: postgresql://app_user:app_password@localhost:5432/pms
  DATABASE_URL_MIGRATIONS: postgresql://postgres:postgres@localhost:5432/pms
  REDIS_URL: redis://localhost:6379/0
  JWT_ACCESS_SECRET: ci-access-secret-0123456789-0123456789
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789-012345678
  PII_ENC_KEY_CURRENT: 'k1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
  PII_HMAC_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
  S3_ENDPOINT: http://localhost:9000
  S3_BUCKET: pms-ci
  S3_ACCESS_KEY: ci
  S3_SECRET_KEY: ci

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pms"
          --health-interval 3s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 15
      # Mailpit: auth reset-password e2e gửi SMTP :1025 rồi đọc lại qua API :8025
      # (khớp docker-compose.dev.yml; app SMTP_HOST/PORT mặc định localhost:1025).
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 3s --health-timeout 3s --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # đọc version từ packageManager

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tạo app_user (non-superuser — RLS có hiệu lực thật)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d pms -f infra/docker/initdb/01-app-user.sql

      - name: Migrations (SQL-first) + prisma db pull + generate
        run: pnpm db:migrate

      - name: Gate introspection-clean (ADR-0001 — schema.prisma phải khớp DB)
        run: git diff --exit-code apps/api/prisma/schema.prisma

      - name: Seed required (smoke)
        run: pnpm db:seed:required

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + integration RLS + e2e)
        run: pnpm test

      - name: Build
        run: pnpm build

  # E2E web-admin (docs/18 P2-A1): dựng stack thật → seed demo → Playwright
  # (smoke điều hướng + thu tiền hoá đơn). Playwright tự khởi động api+web.
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_SCHEDULERS: 'false'
      # NEXT_PUBLIC_* bake lúc build web-admin (nút demo + tenant slug cho login).
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_DEFAULT_TENANT_SLUG: demo
      NEXT_PUBLIC_DEMO_MODE: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pms"
          --health-interval 3s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 15
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 3s --health-timeout 3s --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tạo app_user (non-superuser — RLS có hiệu lực thật)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d pms -f infra/docker/initdb/01-app-user.sql

      - name: Migrations + seed (required + demo)
        run: pnpm db:migrate && pnpm db:seed:required && pnpm db:seed:dev

      # Dùng turbo (qua `pnpm build`) để build ĐÚNG THỨ TỰ phụ thuộc — @pms/shared-types
      # /ui phải build TRƯỚC api/web (pnpm --filter đơn lẻ không build dep → TS2307).
      - name: Build api + web-admin (kèm deps shared-types/ui)
        run: pnpm exec turbo run build --filter=@pms/api --filter=@pms/web-admin

      - name: Cài Playwright browser (chromium)
        run: pnpm --filter @pms/web-admin exec playwright install --with-deps chromium

      - name: E2E (Playwright tự khởi động api + web)
        run: pnpm --filter @pms/web-admin test:e2e

      - name: Upload báo cáo Playwright (khi lỗi)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-admin/playwright-report
          retention-days: 7

  # E2E web-staff (docs/18 P2-A2): dựng stack thật → seed demo → Playwright trên
  # profile điện thoại (smoke điều hướng theo vai + luồng check-in + offline shell).
  e2e-web-staff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_SCHEDULERS: 'false'
      # NEXT_PUBLIC_* bake lúc build web-staff (nút demo ở login). web-staff có ô
      # nhập tenant slug → không cần NEXT_PUBLIC_DEFAULT_TENANT_SLUG.
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_DEMO_MODE: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pms"
          --health-interval 3s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 15
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 3s --health-timeout 3s --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tạo app_user (non-superuser — RLS có hiệu lực thật)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d pms -f infra/docker/initdb/01-app-user.sql

      - name: Migrations + seed (required + demo)
        run: pnpm db:migrate && pnpm db:seed:required && pnpm db:seed:dev

      # turbo build đúng thứ tự deps — @pms/shared-types/ui build TRƯỚC api/web.
      # next start (production) mới đăng ký service worker → test offline chạy thật.
      - name: Build api + web-staff (kèm deps shared-types/ui)
        run: pnpm exec turbo run build --filter=@pms/api --filter=@pms/web-staff

      - name: Cài Playwright browser (chromium)
        run: pnpm --filter @pms/web-staff exec playwright install --with-deps chromium

      - name: E2E (Playwright tự khởi động api + web-staff)
        run: pnpm --filter @pms/web-staff test:e2e

      - name: Upload báo cáo Playwright (khi lỗi)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web-staff
          path: apps/web-staff/playwright-report
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Task 8.4: Trivy thay Snyk (OSS, không cần token/account) — quét vuln deps
      # (đọc pnpm-lock.yaml) + secret + misconfig. Chặn merge ở HIGH/CRITICAL;
      # bỏ qua lỗ hổng chưa có bản vá (ignore-unfixed) để không kẹt ngoài tầm.
      - name: Trivy (vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: node_modules

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Task 8.4: chặn merge khi có lỗ hổng HIGH/CRITICAL ở prod deps (zero
      # high/critical). Moderate vẫn cho qua (hiện 2 moderate — theo dõi, không chặn).
      - name: pnpm audit (prod deps — chặn HIGH/CRITICAL)
        run: pnpm audit --prod --audit-level high
